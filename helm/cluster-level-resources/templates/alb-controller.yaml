{{- if index .Values "alb-controller" "enabled" }}
{{- $clusterName := .Values.eksClusterName | default .Values.cluster | toString }}
{{- $defaultRoleArn := printf "arn:aws:iam::%s:role/gen3_service/%s--default--ingress" (.Values.accountNumber | toString) $clusterName }}
{{- $albControllerRoleArn := default $defaultRoleArn (index .Values "alb-controller" "serviceAccount" "annotations" "eks.amazonaws.com/role-arn") }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alb-controller
  namespace: argocd
spec:
  project: default
  sources:
    - chart: aws-load-balancer-controller
      repoURL: https://aws.github.io/eks-charts
      targetRevision: {{ index .Values "alb-controller" "targetRevision" }}
      helm:
        releaseName: alb-controller
      {{- if index .Values "alb-controller" "configuration" "enabled" }}
        valueFiles:
          - $values/{{ include "cluster-level-resources.configurationBasePath" . }}/alb-controller.yaml
    - repoURL: {{ .Values.configuration.configurationRepo }}
      targetRevision: {{ .Values.configuration.configurationRevision }}
      ref: values
      {{- else }}
        values: |
          clusterName: {{ $clusterName }}
          serviceAccount:
            create: true
            annotations:
              eks.amazonaws.com/role-arn: {{ $albControllerRoleArn | quote }}
            name: aws-load-balancer-controller
          metricsBindAddr: "0.0.0.0:8081"
          hostNetwork: {{ index .Values "alb-controller" "hostNetworkEnabled" }}
      {{- end }}
  destination:
    server: {{ .Values.destinationServer | default "https://kubernetes.default.svc" | quote }}
    namespace: kube-system
  syncPolicy:
    syncOptions:
    - CreateNamespace=false
    automated:
      selfHeal: true
{{ end }}
