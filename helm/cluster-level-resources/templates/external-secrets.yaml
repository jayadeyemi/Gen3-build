{{ if index .Values "external-secrets" "enabled" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.cluster }}-external-secrets
  namespace: argocd
  annotations:
    gen3.io/sync-options-refresh: "2026-05-19-replace-external-secrets-crds"
spec:
  project: default
  sources:
    - chart: external-secrets
      repoURL: https://charts.external-secrets.io
      targetRevision: {{ index .Values "external-secrets" "targetRevision" }}
      helm:
        releaseName: external-secrets
      {{- if index .Values "external-secrets" "configuration" "enabled" }}
        valueFiles:
          - $values/{{ .Values.cluster }}/cluster-values/external-secrets.yaml
    - repoURL: {{ .Values.configuration.configurationRepo }}
      targetRevision: {{ .Values.configurationRevision }}
      ref: values
      {{- else }}
        values: |
          webhook:
            readinessProbe:
              port: 8087
              address: "127.0.0.1"
            hostNetwork: true
            port: 10252
            metrics:
              listen:
                port: 8082
              service:
                port: 8082
      {{- end }}
  destination:
    server: {{ .Values.destinationServer | default "https://kubernetes.default.svc" | quote }}
    namespace: kube-system
  syncPolicy:
    syncOptions:
    - CreateNamespace=false
    - ServerSideApply=true
    - Replace=true
    automated:
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
{{ end }}
