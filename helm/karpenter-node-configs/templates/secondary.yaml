{{- if and (eq .Values.resourceName "secondary") (index .Values "karpenter-crds" "secondary" "enabled") }}
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: secondary
spec:
  {{- if semverCompare ">=1.33" .Capabilities.KubeVersion.Version }}
  amiFamily: AL2023
  {{- else }}
  amiFamily: AL2
  {{- end }}
  amiSelectorTerms:
  {{- if not (index .Values "karpenter-crds" "useAlias") }}
  - name: {{ index .Values "karpenter-crds" "amiSelectorName" }}
    owner: {{ index .Values "karpenter-crds" "amiOwner" | quote }}
  {{- else }}
  - alias: {{ index .Values "karpenter-crds" "alias" | quote }}
  {{- end }}
  blockDeviceMappings:
  - deviceName: /dev/xvda
    ebs:
      deleteOnTermination: true
      encrypted: true
      volumeSize: {{ index .Values "karpenter-crds" "secondary" "volumeSize" }}
      volumeType: gp3
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: optional
  role: eks_{{ index .Values "karpenter-crds" "selectorTag" }}_workers_role
  securityGroupSelectorTerms:
  - tags:
      karpenter.sh/discovery: {{ index .Values "karpenter-crds" "selectorTag" }}
  subnetSelectorTerms:
  - tags:
      karpenter.sh/discovery: {{ index .Values "karpenter-crds" "selectorTag" }}
  tags:
    Environment: {{ .Values.cluster }}
    Name: eks-{{ .Values.cluster }}-karpenter
    karpenter.sh/discovery: {{ index .Values "karpenter-crds" "selectorTag" }}
    purpose: default
  userData: |
    MIME-Version: 1.0
    Content-Type: multipart/mixed; boundary="BOUNDARY"

    --BOUNDARY
    Content-Type: text/x-shellscript; charset="us-ascii"

    #!/bin/bash -x
    echo "$(jq '.registryPullQPS=0' /etc/kubernetes/kubelet/kubelet-config.json)" > /etc/kubernetes/kubelet/kubelet-config.json
    curl https://raw.githubusercontent.com/uc-cdis/cloud-automation/master/files/authorized_keys/ops_team >> /home/ec2-user/.ssh/authorized_keys &
    sysctl -w fs.inotify.max_user_watches=12000 &

    --BOUNDARY--
  kubelet:
    evictionHard:
      memory.available: 5%
    evictionSoft:
      memory.available: 10%
    evictionSoftGracePeriod:
      memory.available: 5m
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: secondary
spec:
  template:
    metadata:
      labels:
        role: default
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: secondary
      expireAfter: 168h
      terminationGracePeriod: 48h
      requirements:
{{ toYaml (index .Values "karpenter-crds" "secondary" "requirements") | nindent 6 }}
  disruption:
    consolidateAfter: {{ index .Values "karpenter-crds" "secondary" "consolidateAfter" }}
    consolidationPolicy: {{ index .Values "karpenter-crds" "secondary" "consolidationPolicy" }}
    budgets:
    - nodes: {{ index .Values "karpenter-crds" "secondary" "disruptionBudget" }}
  limits:
    cpu: "1000"
    memory: 1000Gi
  weight: {{ index .Values "karpenter-crds" "secondary" "weight" }}
{{- end }}
