{{- if and (.Values.global.externalSecrets.deploy) (.Values.global.postgres.externalSecret) }}
{{- $targetName := coalesce .Values.global.postgres.externalSecret "postgres-dbcreds" }}
{{- $remoteKey := coalesce .Values.global.postgres.externalSecretRemoteKey .Values.global.postgres.externalSecret "postgres-dbcreds" }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $targetName }}
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: {{include "common.SecretStore" .}}
    kind: SecretStore
  target:
    name: {{ $targetName }}
    creationPolicy: Owner
{{- if .Values.global.postgres.externalSecretRemoteKey }}
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        host: {{ required "global.postgres.master.host is required when global.postgres.externalSecretRemoteKey is set" .Values.global.postgres.master.host | quote }}
        port: {{ default "5432" .Values.global.postgres.master.port | quote }}
  data:
  - secretKey: username
    remoteRef:
      key: {{ $remoteKey | quote }}
      property: username
      conversionStrategy: Default
      decodingStrategy: None
  - secretKey: password
    remoteRef:
      key: {{ $remoteKey | quote }}
      property: password
      conversionStrategy: Default
      decodingStrategy: None
{{- else }}
  dataFrom:
  - extract:
      key: {{ $remoteKey }}
      conversionStrategy: Default
      decodingStrategy: None
{{- end }}
{{- end }}
